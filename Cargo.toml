# jff-portal: an xdg-desktop-portal ScreenCast backend for jff that can share a single window.
# Its own package (not part of jff's build), so jff gains no dependencies:
# `cargo build --release --manifest-path portal/Cargo.toml`.
[package]
name = "jff-portal"
version = "0.0.1"
edition = "2021"
description = "xdg-desktop-portal ScreenCast backend for jff: share a window or a monitor"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "jff-portal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
libc = "0.2"
pipewire = "0.10.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = "5"

[profile.release]
debug = "line-tables-only"

# Keep cargo from treating this as a member of any enclosing workspace.
[workspace]
